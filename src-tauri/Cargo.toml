[package]
name = "rysgally-hasap-market"
version = "0.5.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools", "image-png", "image-ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
tauri-plugin-log = "2"
log = "0.4"
url = "2"
tokio = { version = "1", features = ["time"] }
