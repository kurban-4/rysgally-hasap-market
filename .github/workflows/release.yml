name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            php-binary: php-aarch64-apple-darwin
            php-extensions: pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter,opcache
            php-verify-extensions: pdo_sqlite,sqlite3,mbstring,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            php-binary: php-x86_64-pc-windows-msvc.exe
            # curl does not pass static-php-cli compile checks on Windows
            php-extensions: pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,tokenizer,xml,dom,session,ctype,filter,opcache
            php-verify-extensions: pdo_sqlite,sqlite3,mbstring,fileinfo,zip,openssl,tokenizer,xml,dom,session,ctype,filter

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, fileinfo
          tools: composer:v2

      - name: Setup Xcode (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select --install || true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Create binaries directory
        shell: bash
        run: mkdir -p src-tauri/binaries

      - name: Build Static PHP (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-macos-aarch64.tar.gz -o spc.tar.gz
          tar -xzf spc.tar.gz
          chmod +x spc
          ./spc doctor --auto-fix
          ./spc download --with-php=8.4 --for-extensions="${{ matrix.php-extensions }}" --prefer-pre-built
          ./spc build --build-cli "${{ matrix.php-extensions }}"
          cp buildroot/bin/php src-tauri/binaries/php-aarch64-apple-darwin
          chmod +x src-tauri/binaries/php-aarch64-apple-darwin

      - name: Build Static PHP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SSL_NO_REVOKE: true
        run: |
          # GitHub Actions Windows runners can fail curl/schannel with CRYPT_E_REVOCATION_OFFLINE.
          # Prefer Git for Windows curl (OpenSSL) and soften revocation checks for git/spc.
          $gitCurlDir = "C:\Program Files\Git\mingw64\bin"
          if (Test-Path $gitCurlDir) {
            $env:PATH = "$gitCurlDir;$env:PATH"
          }
          git config --global http.schannelCheckRevoke false
          git config --global http.sslRevokeBestEffort true
          "ssl-revoke-best-effort" | Out-File -FilePath "$env:USERPROFILE\.curlrc" -Encoding ascii -NoNewline
          New-Item -ItemType Directory -Force -Path "downloads" | Out-Null

          $spcArgs = @(
            "download", "--with-php=8.4",
            "--for-extensions=${{ matrix.php-extensions }}",
            "--prefer-pre-built"
          )
          $buildArgs = @("build", "--build-cli", "${{ matrix.php-extensions }}")

          function Invoke-Spc {
            param([string[]]$Args)
            & .\spc.exe @Args
            if ($LASTEXITCODE -ne 0) {
              throw "spc.exe failed: spc $($Args -join ' ')"
            }
          }

          Invoke-WebRequest -Uri "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe" -OutFile "spc.exe"
          Invoke-Spc @("doctor", "--auto-fix")

          $downloaded = $false
          foreach ($attempt in 1..3) {
            try {
              Write-Host "static-php-cli download attempt $attempt..."
              Invoke-Spc $spcArgs
              $downloaded = $true
              break
            } catch {
              Write-Warning $_
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 15
            }
          }
          if (-not $downloaded) {
            throw "static-php-cli download failed after 3 attempts"
          }

          Invoke-Spc $buildArgs

          $phpExe = "buildroot\bin\php.exe"
          if (-not (Test-Path $phpExe)) {
            throw "Missing static PHP output: $phpExe"
          }

          # Remove the non-static PHP distribution from git (php.exe needs php8.dll at runtime).
          Remove-Item -Recurse -Force "src-tauri\binaries\php-x86_64-pc-windows-msvc" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          Copy-Item $phpExe -Destination "src-tauri\binaries\php-x86_64-pc-windows-msvc.exe"

      - name: Build Laravel assets
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          npm install
          npm run build

      - name: Install Composer dependencies
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Create temporary .env
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          grep -q '^SESSION_DRIVER=' .env && sed -i.bak 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env || echo 'SESSION_DRIVER=file' >> .env
          grep -q '^CACHE_STORE=' .env && sed -i.bak 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env || echo 'CACHE_STORE=file' >> .env
          grep -q '^QUEUE_CONNECTION=' .env && sed -i.bak 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || echo 'QUEUE_CONNECTION=sync' >> .env
          rm -f .env.bak

      - name: Fix Pdo\Mysql issue
        shell: bash
        run: |
          CONFIG="src-tauri/resources/rysgally-hasap-market/config/database.php"
          CONNECTOR="src-tauri/resources/rysgally-hasap-market/vendor/laravel/framework/src/Illuminate/Database/Connectors/MySqlConnector.php"
          for FILE in "$CONFIG" "$CONNECTOR"; do
            if [ -f "$FILE" ]; then
              sed -i 's/PDO::MYSQL_ATTR_SSL_CA/1009/g' "$FILE" 2>/dev/null || sed -i '' 's/PDO::MYSQL_ATTR_SSL_CA/1009/g' "$FILE"
            fi
          done

      - name: Verify PHP sidecar binary
        shell: bash
        run: |
          PHP_BIN="src-tauri/binaries/${{ matrix.php-binary }}"
          if [ ! -f "$PHP_BIN" ]; then
            echo "Missing PHP sidecar: $PHP_BIN"
            ls -la src-tauri/binaries || true
            exit 1
          fi
          echo "Found PHP sidecar: $PHP_BIN"
          "$PHP_BIN" -v
          "$PHP_BIN" -c src-tauri/binaries/php.ini -r "
            \$required = explode(',', '${{ matrix.php-verify-extensions }}');
            foreach (\$required as \$ext) {
              if (!extension_loaded(\$ext)) {
                fwrite(STDERR, \"MISSING extension: \$ext\n\");
                exit(1);
              }
              echo \"\$ext: OK\n\";
            }
            echo extension_loaded('Zend OPcache') ? 'opcache: OK' : 'opcache: MISSING';
          "
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -f "src-tauri/binaries/php-x86_64-pc-windows-msvc/php.exe" ]; then
              echo "ERROR: Non-static php.exe must not be bundled (requires php8.dll)."
              exit 1
            fi
            if [ -f "src-tauri/binaries/php-x86_64-pc-windows-msvc/php8.dll" ]; then
              echo "ERROR: php8.dll folder must not be present in the bundle."
              exit 1
            fi
          fi

      - name: Clean Install
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
          cd src-tauri
          cargo fetch

      - name: Build App
        shell: bash
        run: |
          npm run build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if ! npx tauri build --target ${{ matrix.target }}; then
              echo "Retrying macOS DMG bundle after fixing script permissions..."
              find "src-tauri/target/${{ matrix.target }}" -name "*.sh" -type f -exec chmod +x {} \;
              npx tauri build --target ${{ matrix.target }}
            fi
          else
            npx tauri build --target ${{ matrix.target }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify macOS DMG bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: macOS DMG not found"
            find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || true
            exit 1
          fi
          echo "DMG bundle: $DMG"

      - name: Verify Windows bundle sidecar
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          RELEASE_DIR="src-tauri/target/${{ matrix.target }}/release"
          SIDECAR=""
          # Tauri strips the target triple and copies the sidecar as php.exe on Windows.
          for CANDIDATE in \
            "$RELEASE_DIR/php.exe" \
            "$RELEASE_DIR/php-x86_64-pc-windows-msvc.exe"
          do
            if [ -f "$CANDIDATE" ]; then
              SIDECAR="$CANDIDATE"
              break
            fi
          done
          if [ -z "$SIDECAR" ]; then
            echo "ERROR: PHP sidecar missing from release output"
            ls -la "$RELEASE_DIR/" || true
            exit 1
          fi
          echo "Sidecar present in release bundle: $SIDECAR"
          "$SIDECAR" -v
          NSIS_INSTALLER=$(find "$RELEASE_DIR/bundle/nsis" -name "*.exe" 2>/dev/null | head -1)
          if [ -z "$NSIS_INSTALLER" ]; then
            echo "ERROR: NSIS installer not found"
            find "$RELEASE_DIR/bundle" -type f 2>/dev/null || true
            exit 1
          fi
          echo "NSIS installer: $NSIS_INSTALLER"

      - name: Debug - Find built files
        if: always()
        shell: bash
        run: find src-tauri/target -name "*.dmg" -o -name "*.exe" -o -name "*.msi" 2>/dev/null || echo "NO FILES FOUND"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rysgally-hasap-market-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe