name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            php-binary: php-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            php-binary: php-x86_64-pc-windows-msvc/php.exe 

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: src-tauri/resources/rysgally-hasap-market/vendor
          key: composer-${{ hashFiles('src-tauri/resources/rysgally-hasap-market/composer.lock') }}
          restore-keys: |
            composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP and Composer (macOS)
        if: matrix.os == 'macos-latest'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, fileinfo
          tools: composer:v2

      - name: Install Composer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ComposerUrl = "https://getcomposer.org/composer.phar"
          $ComposerPath = "composer.phar"
          Invoke-WebRequest -Uri $ComposerUrl -OutFile $ComposerPath
          Move-Item -Path $ComposerPath -Destination "C:\composer.phar" -Force
          Write-Host "Composer installed"

      - name: Setup Xcode (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select --install || true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Create binaries directory
        shell: bash
        run: mkdir -p src-tauri/binaries

      - name: Verify PHP Binary (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          PHP_BIN="src-tauri/binaries/php-aarch64-apple-darwin"
          if [ ! -f "$PHP_BIN" ]; then
            echo "Error: Missing PHP binary at $PHP_BIN"
            echo "Available files:"
            ls -la src-tauri/binaries/
            exit 1
          fi
          chmod +x "$PHP_BIN"
          echo "PHP binary found and executable"

      - name: Verify PHP Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $PHP_DIR = "src-tauri\binaries\php-x86_64-pc-windows-msvc"
          $PHP_EXE = Join-Path $PHP_DIR "php.exe"
          $PHP_DLL = Join-Path $PHP_DIR "php8.dll"
          
          if (-not (Test-Path $PHP_EXE)) {
            Write-Error "Missing PHP executable at $PHP_EXE"
            Write-Host "Available files in binaries:"
            Get-ChildItem "src-tauri\binaries\" -Recurse | Select-Object FullName
            exit 1
          }
          
          if (-not (Test-Path $PHP_DLL)) {
            Write-Error "Missing php8.dll at $PHP_DLL"
            exit 1
          }
          
          Write-Host "PHP binary and DLLs found in: $PHP_DIR"

      - name: Build Laravel assets
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          npm install
          npm run build

      - name: Install Composer dependencies
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          
          # macOS: always run composer (has system PHP with OpenSSL)
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs
          else
            # Windows: check if vendor exists from cache, otherwise warn
            if [ ! -d "vendor" ]; then
              echo "WARNING: vendor folder not found on Windows"
              echo "This can happen if macOS build hasn't cached vendor yet"
              echo "The build may fail if Laravel dependencies are required"
            fi
          fi

      - name: Create temporary .env
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          grep -q '^SESSION_DRIVER=' .env && sed -i.bak 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env || echo 'SESSION_DRIVER=file' >> .env
          grep -q '^CACHE_STORE=' .env && sed -i.bak 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env || echo 'CACHE_STORE=file' >> .env
          grep -q '^QUEUE_CONNECTION=' .env && sed -i.bak 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || echo 'QUEUE_CONNECTION=sync' >> .env
          rm -f .env.bak

      - name: Fix Pdo\Mysql issue
        shell: bash
        run: |
          CONFIG="src-tauri/resources/rysgally-hasap-market/config/database.php"
          CONNECTOR="src-tauri/resources/rysgally-hasap-market/vendor/laravel/framework/src/Illuminate/Database/Connectors/MySqlConnector.php"
          for FILE in "$CONFIG" "$CONNECTOR"; do
            if [ -f "$FILE" ]; then
              sed -i 's/PDO::MYSQL_ATTR_SSL_CA/1009/g' "$FILE" 2>/dev/null || sed -i '' 's/PDO::MYSQL_ATTR_SSL_CA/1009/g' "$FILE"
            fi
          done

      - name: Verify PHP sidecar binary
        shell: bash
        run: |
          PHP_BIN="src-tauri/binaries/${{ matrix.php-binary }}"
          if [ ! -f "$PHP_BIN" ]; then
            echo "Missing PHP sidecar: $PHP_BIN"
            echo "Available files in binaries:"
            find src-tauri/binaries -type f -name 'php*' | head -20
            ls -la src-tauri/binaries/ || true
            exit 1
          fi
          echo "Found PHP sidecar: $PHP_BIN"

      - name: Clean Install
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
          cd src-tauri
          cargo fetch

      - name: Build App
        run: |
          npm run build
          npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix bundle script permissions (macOS)
        if: matrix.os == 'macos-latest' && failure()
        shell: bash
        run: |
          find src-tauri/target -name "*.sh" -type f -exec chmod +x {} \;
          npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Debug - Find built files
        if: always()
        shell: bash
        run: find src-tauri/target -name "*.dmg" -o -name "*.exe" -o -name "*.msi" 2>/dev/null || echo "NO FILES FOUND"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rysgally-hasap-market-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe