name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            php-binary: php-x86_64-pc-windows-msvc.exe 
          - os: macos-latest
            target: aarch64-apple-darwin
            php-binary: php-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, fileinfo
          tools: composer:v2

      - name: Setup Xcode (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select --install || true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Validate updater signing key (fail fast)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty"
            exit 1
          fi
          FIRST_LINE=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | head -1 || true)
          if [[ "$FIRST_LINE" != "untrusted comment:"* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is malformed. It must be the EXACT one-line base64 content of the .key file generated by 'tauri signer generate' (decoded content must start with 'untrusted comment:')."
            exit 1
          fi
          echo "Signing key format OK"

      - name: Create binaries directory
        shell: bash
        run: mkdir -p src-tauri/binaries

      - name: Build Static PHP (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-macos-aarch64.tar.gz -o spc.tar.gz
          tar -xzf spc.tar.gz
          chmod +x spc
          ./spc doctor --auto-fix
          ./spc download --with-php=8.4 --for-extensions="pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter,opcache" --prefer-pre-built
          ./spc build --build-cli "pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter,opcache"
          cp buildroot/bin/php src-tauri/binaries/php-aarch64-apple-darwin
          chmod +x src-tauri/binaries/php-aarch64-apple-darwin

      - name: Build Static PHP (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/crazywhalecc/static-php-cli/releases/download/v2.6.0/spc-windows-x64.exe" -OutFile "spc.exe"
          .\spc.exe doctor --auto-fix
          .\spc.exe download --with-php=8.4 --for-extensions="pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter,opcache" --prefer-pre-built
          .\spc.exe build --build-cli "pdo,pdo_sqlite,sqlite3,mbstring,mbregex,fileinfo,zip,openssl,curl,tokenizer,xml,dom,session,ctype,filter,opcache" --debug
          Copy-Item "buildroot\bin\php.exe" -Destination "src-tauri\binaries\php-x86_64-pc-windows-msvc.exe"

      - name: Build Laravel assets
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          npm install
          npm run build
          # node_modules is only needed for the asset build above;
          # remove it so the resource glob doesn't bundle it into the installer
          rm -rf node_modules

      - name: Install Composer dependencies
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Create temporary .env
        shell: bash
        run: |
          cd src-tauri/resources/rysgally-hasap-market
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          grep -q '^SESSION_DRIVER=' .env && sed -i.bak 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env || echo 'SESSION_DRIVER=file' >> .env
          grep -q '^CACHE_STORE=' .env && sed -i.bak 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env || echo 'CACHE_STORE=file' >> .env
          grep -q '^QUEUE_CONNECTION=' .env && sed -i.bak 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env || echo 'QUEUE_CONNECTION=sync' >> .env
          rm -f .env.bak

      - name: Verify PHP sidecar binary
        shell: bash
        run: |
          PHP_BIN="src-tauri/binaries/${{ matrix.php-binary }}"
          if [ ! -f "$PHP_BIN" ]; then
            echo "Missing PHP sidecar: $PHP_BIN"
            ls -la src-tauri/binaries || true
            exit 1
          fi
          echo "Found PHP sidecar: $PHP_BIN"
          src-tauri/binaries/${{ matrix.php-binary }} -c src-tauri/binaries/php.ini \
            -r "echo extension_loaded('Zend OPcache') ? 'opcache: OK' : 'opcache: MISSING';" || true

      - name: Clean Install
        shell: bash
        run: |
          rm -f package-lock.json
          npm install
          cd src-tauri
          cargo fetch

      - name: Build App
        run: |
          npm run build
          npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          
      - name: Show SPC log (Windows)
        if: failure() && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
            if (Test-Path "log\spc.output.log") { Get-Content "log\spc.output.log" }
            if (Test-Path "log\spc.shell.log")  { Get-Content "log\spc.shell.log"  }    

      - name: Fix bundle script permissions (macOS)
        if: matrix.os == 'macos-latest' && failure()
        shell: bash
        run: |
          find src-tauri/target -name "*.sh" -type f -exec chmod +x {} \;
          npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Debug - Find built files
        if: always()
        shell: bash
        run: find src-tauri/target -name "*.dmg" -o -name "*.exe" -o -name "*.msi" 2>/dev/null || echo "NO FILES FOUND"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rysgally-hasap-market-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs
          gh release view "$TAG" --repo "$REPO" --json assets > assets.json

          python3 - <<'EOF'
          import json, os, glob
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          version = tag.lstrip("v")

          asset_names = [a["name"] for a in json.load(open("assets.json"))["assets"]]

          def entry(suffix):
              for sig_path in glob.glob("sigs/*.sig"):
                  base = os.path.basename(sig_path)[:-4]  # strip ".sig"
                  if base.endswith(suffix) and base in asset_names:
                      url = f"https://github.com/{repo}/releases/download/{tag}/{base}"
                      return {"signature": open(sig_path).read().strip(), "url": url}
              return None

          platforms = {}
          mac = entry(".app.tar.gz")
          if mac:
              platforms["darwin-aarch64"] = mac
          win = entry(".exe")
          if win:
              platforms["windows-x86_64"] = win

          if not platforms:
              raise SystemExit("No updater artifacts (.sig) found in the release")

          manifest = {
              "version": version,
              "notes": f"Release {tag}",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": platforms,
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber